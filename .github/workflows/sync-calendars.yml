# Sincroniza os calendários do Booking e do Airbnb com o site.
# Corre a cada 30 minutos, quando se altera data/direct-bookings.json,
# ou à mão em Actions → "Sincronizar calendários" → Run workflow.
name: Sincronizar calendários

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/direct-bookings.json', 'scripts/sync-calendars.mjs']

permissions:
  contents: write

concurrency:
  group: sync-calendars
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ler calendários e gerar disponibilidade
        env:
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
        run: node scripts/sync-calendars.mjs

      - name: Guardar se houver alterações
        run: |
          git add data/availability.json calendar.ics
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git config user.name "calendar-sync[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Atualizar disponibilidade dos calendários"
            git push
          fi
