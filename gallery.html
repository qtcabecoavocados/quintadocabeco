  <script>
    (function () {
      var tabs = document.querySelectorAll('.gtab');
      var panels = document.querySelectorAll('.gpanel');
      function activate(target) {
        tabs.forEach(function (t) { t.classList.toggle('active', t.dataset.target === target); });
        panels.forEach(function (p) { p.classList.toggle('active', p.id === target); });
        history.replaceState(null, '', '#' + target);
      }
      tabs.forEach(function (t) { t.addEventListener('click', function () { activate(t.dataset.target); }); });
      var hash = window.location.hash.replace('#', '');
      if (hash && document.getElementById(hash)) activate(hash);
    })();
  </script>
